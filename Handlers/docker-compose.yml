services:
  frontend:
    container_name: yggdrasil_frontend
    build: ../Frontend
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./.env:/app/.env:ro
      - ./certs:/app/certs:ro
      - ../Agent_Profiles/:/app/Agent_Profiles/:ro
    environment:
      FRONTEND_BACKEND_PORT: 8080
      REDIS_HOST: redis
      YGG_CORE: yggdrasil_core
      YGG_CORE_PORT: 8000
      ENDPOINT: /admin
    ports:
      - "127.0.0.1:8080:8080"
    restart: always
    networks:
      - yggdrasil

  yggdrasil_core:
    container_name: Yggdrasil_Core
    build: ./Yggdrasil_Core
    expose:
      - "8000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./.env:/app/.env:ro
      - ./Yggdrasil_Core/hosted_files:/app/hosted_files
      - ./certs:/app/certs:ro
      - ./Listeners:/app/listeners:ro
      - ${PROJECT_ROOT}/Agent_Profiles/:/app/Agent_Profiles/:ro
      - ${PROJECT_ROOT}/Wrappers/:/app/Wrappers/:ro
      - ${PROJECT_ROOT}/Compiled_Payloads/:/app/Compiled_Payloads/:rw
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always
    networks:
      - yggdrasil
    environment:
      REDIS_HOST: redis
      LISTENERS_DIR: /app/listeners
      COMPILED_PAYLOADS: ${PROJECT_ROOT}/Compiled_Payloads:/app/Compiled_Payloads:rw
      WRAPPERS_DIR: ${PROJECT_ROOT}/Wrappers:/app/Wrappers:rw

  redis:
    image: redis:latest
    container_name: redis
    command:
      redis-server 
      --requirepass ${REDIS_PASS} 
    restart: always
    expose:
      - "6379"
    networks:
      - yggdrasil

  mariadb:
    build: ./mariadb
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DATABASE}    
      MYSQL_USER: ${DB_USER}             
      MYSQL_PASSWORD: ${DB_PASS}
    expose:
      - "3306"
    volumes:
      - ./mariadb/data:/var/lib/mysql
      - ./mariadb/health.cnf:/root/.my.cnf:ro
    restart: always
    networks:
      - yggdrasil
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - "8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
    depends_on:
      - file_host
    networks:
      - yggdrasil

  file_host:
    container_name: file_host
    build: ./file_host
    expose:
      - "8081"
    volumes:
      - ./file_host/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    restart: always
    networks:
      - yggdrasil

networks:
  yggdrasil:
    driver: bridge